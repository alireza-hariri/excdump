[project]
name = "excdump"
version = "0.1.0"
description = "Capture a full exception snapshot and debug it later, offline."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dill>=0.4.1",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["excdump"]

[dependency-groups]
dev = ["pyflakes>=3.4"]
